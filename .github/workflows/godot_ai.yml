name: 🤖 Godot AI tooling
on:
  push:
    paths:
      - "tools/relay/**"
      - "modules/godot_ai/**"
      - ".github/workflows/godot_ai.yml"
  pull_request:
    paths:
      - "tools/relay/**"
      - "modules/godot_ai/**"
      - ".github/workflows/godot_ai.yml"
  workflow_dispatch:

concurrency:
  group: godot-ai-${{github.head_ref || github.run_number}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # The relay is engine-independent and builds in seconds, so it gates the slower
  # editor job: a broken transport should fail in under a minute, not after a build.
  relay:
    name: Relay build and integration tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the relay
        run: tools/relay/build.sh

      - name: Run relay integration tests
        run: python3 tools/relay/tests/run_tests.py

      # The virtual display has no engine dependency either, so it is checked on the
      # fast job rather than after a ten-minute build.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11-utils

      - name: Run tooling tests
        run: python3 tools/tests/run_tests.py

      # The benchmark suite has no engine dependency either. The self-check is the
      # important one: a benchmark whose planted defect stops reproducing fails silently
      # in the flattering direction, so it is checked on every push rather than trusted.
      - name: Run benchmark scoring tests
        run: python3 tools/benchmarks/tests/run_tests.py

      - name: Check the benchmarks still measure something
        run: python3 tools/benchmarks/run_selfcheck.py

      # A skill naming a tool that does not exist is worse than an omission: the model
      # reaches for it, gets "unknown tool", and either abandons the skill or improvises
      # around it, and nobody sees that until it happens in front of a user. Needs no
      # build, so it runs here rather than in the editor job.
      - name: Check the shipped skills name tools that exist
        run: python3 tools/skills/check_skills.py

      # The Windows backend cannot be run here, but keeping it compiling is what
      # stops it rotting between releases.
      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: Cross-compile the relay for Windows
        run: tools/relay/build.sh --windows

      # Builds from the tracked tree only, so a missing file or a build that relies
      # on local state fails here rather than for whoever clones it next.
      - name: Verify a clean checkout builds and packages
        run: python3 tools/relay/tests/run_clean_checkout.py

  editor:
    name: Editor module tests and end-to-end
    needs: relay
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libxi-dev libxrandr-dev
          python3 -m pip install scons

      # A CI runner has no screen, so the end-to-end run would otherwise only be able
      # to check that the visual tools refuse. With these it starts its own display and
      # checks that they work: a real screenshot, a running game reporting its tree,
      # and a question answered by clicking the dialog (xdotool).
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libgl1-mesa-dri xdotool

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.scons_cache/
          key: godot-ai-${{github.ref}}-${{github.sha}}
          restore-keys: |
            godot-ai-${{github.ref}}-
            godot-ai-

      - name: Build the editor with tests
        env:
          SCONS_CACHE: ${{github.workspace}}/.scons_cache/
        run: |
          scons platform=linuxbsd target=editor dev_build=yes debug_symbols=no \
            scu_build=yes tests=yes warnings=extra werror=yes -j$(nproc)

      - name: Build the relay
        run: tools/relay/build.sh

      # Run from outside the checkout: the test binary's working directory is what a
      # misbehaving fixture would damage.
      - name: Run module unit tests
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/bin/godot.linuxbsd.editor.dev.x86_64" \
            --headless --test --test-case="*[godot_ai]*"

      # Starts its own virtual display, so this covers screenshots, the play lifecycle
      # and runtime scene-tree inspection, not just their refusal paths.
      - name: Run end-to-end test against a live editor
        run: python3 tools/relay/tests/run_editor_e2e.py

      # The refusal paths still have to hold on a machine that really has no display.
      - name: Run end-to-end test headless
        run: python3 tools/relay/tests/run_editor_e2e.py --headless

      # Drives the editor by keyboard and pointer: the command palette, and the
      # approvals dialog that is the only way a client or a skill gets allowed.
      - name: Run editor UI end-to-end test
        run: python3 tools/relay/tests/run_editor_ui_e2e.py

      # Recording and replaying inside one process proves nothing about the trace
      # format: every absolute path and every in-memory assumption survives a round
      # trip that never leaves the process. This one records in one editor, exits,
      # and replays in another. About 45 seconds.
      - name: Replay a session recorded by a different editor
        run: python3 tools/relay/tests/run_replay_two_editors.py
