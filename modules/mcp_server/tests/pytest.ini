[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    p0: must pass before release
    p1: must pass for production
    p2: quality/robustness
    requires_game: needs running game instance
    security: security-focused test
    sse: requires SSE support
    slow: test takes >5 seconds

# Default: show verbose output, short traceback
addopts = -v --tb=short

# Timeout for individual tests (requires pytest-timeout)
# timeout = 30
